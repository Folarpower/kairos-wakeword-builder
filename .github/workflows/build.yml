name: Build Kairos Wake Word

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y espeak-ng ffmpeg sox libsndfile1 portaudio19-dev

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "livekit-wakeword[train,eval,export]"

      - name: Setup training environment
        run: |
          livekit-wakeword setup --config config.yaml

      - name: Run training and export ONNX
        run: |
          livekit-wakeword run config.yaml

      - name: Upload ONNX model artifact
        uses: actions/upload-artifact@v4
        with:
          name: kairos-onnx-model
          path: |
            *.onnx
            output/**/*.onnx
